<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />

    <!-- SEO Meta -->
    <meta name="description" content="Modern React application with optimized performance and SEO." />
    <meta name="keywords" content="React, Web App, JavaScript, Frontend, UI" />
    <meta name="author" content="Your Name" />

    <!-- Favicon & Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="React App" />
    <meta property="og:description" content="A modern and scalable React application." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Example Font (optional) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

    <!-- Title -->
    <title>React App | Modern UI</title>
  </head>

  <body>
    <!-- No Script Fallback -->
    <noscript>
      <strong>This application requires JavaScript to run properly. Please enable it in your browser.</strong>
    </noscript>

    <!-- Root Element -->
    <div id="root"></div>

    <!-- Optional: Loading Indicator -->
    <div id="loader" style="text-align:center; padding:20px; font-family: Inter, sans-serif;">
      Loading application...
    </div>

    <!-- Notes:
      - Scripts will be injected automatically during build.
      - Only files inside /public can be referenced here.
      - Supports client-side routing and non-root deployments.
    -->
  </body>
</html>
